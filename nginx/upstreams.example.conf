# 설정 검사·격리된 요청 테스트의 예시. 운영 A/B 목록은 배포 스크립트에서 생성.
upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:8080 resolve;
}
upstream gateway_upstream {
    zone gateway_upstream 64k;
    server gateway-service:8080 resolve;
}
upstream prediction_upstream {
    zone prediction_upstream 64k;
    server prediction-service:8080 resolve;
}
