# Cloudflare가 전달한 원래 요청 프로토콜 사용
# 외부까지는 https, Docker Nginx까지는 http로 전달됨
# 헤더가 없다면 Nginx가 직접 받은 요청의 프로토콜 사용
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Cloudflare가 전달한 실제 클라이언트 IP 사용
# Cloudflare를 거치지 않은 내부 요청이라면 바로 앞 연결의 IP 사용
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    # Docker 네트워크 안에서 HTTP 80으로 요청 받음
    # 외부 HTTPS 처리는 Cloudflare가 담당
    listen 80;
    server_name _;

    # 오류 페이지에서 nginx/1.30.3 같은 상세 버전을 숨김
    server_tokens off;

    # 브라우저의 Content-Type 임의 추측 방지
    add_header X-Content-Type-Options "nosniff" always;

    # 다른 사이트에서 iframe으로 화면을 감싸는 것 방지
    add_header X-Frame-Options "DENY" always;

    # 외부 사이트로 불필요하게 전체 URL이 전달되는 것을 제한
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker Nginx 자체의 생존 확인 경로
    # 다른 서비스 상태와 관계없이 Nginx만 살아 있으면 200 반환
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 외부에서 사용할 Gateway health 경로
    # Gateway Actuator의 실제 경로로 변환해서 전달
    location = /api/health {
        proxy_pass http://gateway-service:8080/actuator/health;

        # 원래 요청의 도메인, 클라이언트 IP, 프로토콜 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 모든 일반 API 요청: Gateway로 전달
    location /api/ {
        # proxy_pass 끝에 /를 붙이지 않아야
        # /api/rules/ping 경로가 그대로 Gateway에 전달됨
        proxy_pass http://gateway-service:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # /api/가 아닌 나머지 요청: 현재 더미 프론트로 전달
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}