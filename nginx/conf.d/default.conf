# Cloudflare가 전달한 원래 요청 프로토콜 사용
# 외부까지는 https, Docker Nginx까지는 http로 전달됨
# 헤더가 없다면 Nginx가 직접 받은 요청의 프로토콜 사용
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Cloudflare가 전달한 실제 클라이언트 IP 사용
# Cloudflare를 거치지 않은 내부 요청이라면 바로 앞 연결의 IP 사용
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# 외부 응답용 Request ID
# Nginx 자체 생존 확인 경로만 Header 생략
map $uri $response_request_id {
    /health  "";
    default  $request_id;
}

map $status $access_log_level {
    ~^[1234] "INFO";
    ~^5     "ERROR";
    default "INFO";
}

map $status $access_outcome {
    ~^[123] "success";
    ~^[45]  "failure";
    default "unknown";
}

# 원본 경로를 대체하는 종류 수가 제한된 Route
map $uri $omagotchi_route {
    /api/health          "/api/health";
    /api/v1/internal    "/api/v1/internal/**";
    ~^/api/v1/internal/ "/api/v1/internal/**";
    ~^/api/              "/api/**";
    default              "/**";
}

# Access Event의 원본 경로·Query·Header·Cookie·Body·Client IP 제외
# 미호출·재시도 표현 보존을 위한 Upstream 시간값의 문자열 기록
log_format omagotchi_access escape=json
    '{'
      '"@timestamp":"$time_iso8601",'
      '"log":{"level":"$access_log_level"},'
      '"service":{"name":"nginx","version":"1.30.3","environment":"prod","node":{"name":"$hostname"}},'
      '"event":{"dataset":"nginx.access","action":"http.server.request.completed","outcome":"$access_outcome"},'
      '"message":"HTTP request completed",'
      '"http":{"request":{"id":"$request_id","method":"$request_method"},'
               '"response":{"status_code":$status,"body":{"bytes":$body_bytes_sent}}},'
      '"omagotchi":{"http":{"route":"$omagotchi_route"}},'
      '"nginx":{"request_time_seconds":$request_time,'
                 '"upstream":{"address":"$upstream_addr","status":"$upstream_status",'
                              '"connect_time_seconds":"$upstream_connect_time",'
                              '"header_time_seconds":"$upstream_header_time",'
                              '"response_time_seconds":"$upstream_response_time"}},'
      '"ecs":{"version":"8.11"}'
    '}';

# Docker Container 재생성으로 Service IP가 바뀌어도 Worker 재시작 없이 재해석.
# Docker Embedded DNS 응답을 최대 10초 캐시하고 IP 변경을 주기적으로 반영한다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:8080 resolve;
}

upstream gateway_upstream {
    zone gateway_upstream 64k;
    server gateway-service:8080 resolve;
}

server {
    # Docker 네트워크 안에서 HTTP 80으로 요청 받음
    # 외부 HTTPS 처리는 Cloudflare가 담당
    listen 80;
    server_name _;

    # 중앙 수집용 Container stdout 한 줄 JSON Event
    access_log /dev/stdout omagotchi_access;

    # Request Line이 포함될 수 있는 상세 오류의 제한 용량 tmpfs 보관
    # 중앙 수집 제외와 실행 중 Container 직접 진단 용도
    error_log /var/log/nginx/error.log error;

    # 오류 페이지에서 nginx/1.30.3 같은 상세 버전을 숨김
    server_tokens off;

    # 브라우저의 Content-Type 임의 추측 방지
    add_header X-Content-Type-Options "nosniff" always;

    # 다른 사이트에서 iframe으로 화면을 감싸는 것 방지
    add_header X-Frame-Options "DENY" always;

    # 외부 사이트로 불필요하게 전체 URL이 전달되는 것을 제한
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nginx 생성 Request ID의 정상·오류 응답 반환
    add_header X-Request-ID $response_request_id always;

    # Docker Nginx 자체의 생존 확인 경로
    # 다른 서비스 상태와 관계없이 Nginx만 살아 있으면 200 반환
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 외부에서 사용할 Gateway health 경로
    # Gateway Actuator의 실제 경로로 변환해서 전달
    location = /api/health {
        access_log off;
        proxy_pass http://gateway_upstream/actuator/health;

        # Nginx 자체 Upstream 오류의 공통 JSON 응답
        # Downstream 오류 상태·본문의 무변환 전달
        proxy_intercept_errors off;
        error_page 502 = @api_edge_bad_gateway;
        error_page 503 = @api_edge_service_unavailable;
        error_page 504 = @api_edge_gateway_timeout;

        # 외부·Downstream 값 대신 Nginx 생성값 사용
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header baggage "";
        proxy_hide_header X-Request-ID;

        # 원래 요청의 도메인, 클라이언트 IP, 프로토콜 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 서비스 간 통신 전용 API의 외부 진입 차단
    # Gateway 인증 결과와 무관하게 Nginx에서 404로 종료
    location = /api/v1/internal {
        error_page 404 = @api_edge_not_found;
        return 404;
    }

    location ^~ /api/v1/internal/ {
        error_page 404 = @api_edge_not_found;
        return 404;
    }

    # 모든 일반 API 요청: Gateway로 전달
    location /api/ {
        # proxy_pass 끝에 /를 붙이지 않아야
        # /api/v1/rules/ping 경로가 그대로 Gateway에 전달됨
        proxy_pass http://gateway_upstream;

        # Nginx 자체 Upstream 오류의 공통 JSON 응답
        # Downstream 오류 상태·본문의 무변환 전달
        proxy_intercept_errors off;
        error_page 502 = @api_edge_bad_gateway;
        error_page 503 = @api_edge_service_unavailable;
        error_page 504 = @api_edge_gateway_timeout;

        # 외부·Downstream 값 대신 Nginx 생성값 사용
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header baggage "";
        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 오류 응답 path의 원본 URI 대신 종류 수가 제한된 Route 사용
    # 기존 Request ID·URI Context를 유지하는 상태별 Named Location
    location @api_edge_not_found {
        default_type application/json;
        return 404 '{"code":"COMMON_NOT_FOUND","message":"요청한 리소스를 찾을 수 없습니다.","path":"$omagotchi_route","requestId":"$request_id"}';
    }

    location @api_edge_bad_gateway {
        default_type application/json;
        return 502 '{"code":"COMMON_BAD_GATEWAY","message":"연결된 서비스가 올바르게 응답하지 않았습니다.","path":"$omagotchi_route","requestId":"$request_id"}';
    }

    location @api_edge_service_unavailable {
        default_type application/json;
        return 503 '{"code":"COMMON_SERVICE_UNAVAILABLE","message":"서비스를 일시적으로 사용할 수 없습니다.","path":"$omagotchi_route","requestId":"$request_id"}';
    }

    location @api_edge_gateway_timeout {
        default_type application/json;
        return 504 '{"code":"COMMON_GATEWAY_TIMEOUT","message":"연결된 서비스의 응답 시간이 초과되었습니다.","path":"$omagotchi_route","requestId":"$request_id"}';
    }

    # /api/가 아닌 나머지 요청: Spring Frontend로 전달
    location / {
        proxy_pass http://frontend_upstream;

        # 외부·Frontend 응답값 대신 Nginx 생성값 사용
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header baggage "";
        proxy_hide_header X-Request-ID;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
