events {}

http {
    access_log off;

    server {
        listen 8080;

        location ~ ^/api/v1/rules/failure/ {
            return 444;
        }

        location = /api/v1/rules/downstream-error {
            default_type application/json;
            add_header X-Request-ID "downstream-request-id" always;
            return 503 '{"source":"downstream","status":503}';
        }

        location /api/ {
            add_header X-Received-Request-ID $http_x_request_id always;
            return 204;
        }

        location / {
            add_header X-Received-Request-ID $http_x_request_id always;
            return 204;
        }
    }
}
