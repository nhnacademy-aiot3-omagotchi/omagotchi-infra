receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/sanitize:
    # 정제 실패 시 원문 전달 금지. Debug 로그에도 원본 Context 출력 금지.
    error_mode: propagate
    trace_statements:
      # Spring HTTP 속성의 개별 변환 후 공통 정제. 일부 속성이 없어도 나머지 변환 유지, 기존 OTel 속성 우선.
      - context: span
        conditions:
          - span.kind == SPAN_KIND_SERVER or span.kind == SPAN_KIND_CLIENT
        statements:
          - set(span.attributes["http.request.method"], span.attributes["method"]) where span.attributes["http.request.method"] == nil and IsString(span.attributes["method"])
          # 응답을 받지 못한 IO_ERROR·CLIENT_ERROR·UNKNOWN의 숫자 변환 제외.
          - >-
            set(span.attributes["http.response.status_code"], Int(span.attributes["status"]))
            where span.attributes["http.response.status_code"] == nil and IsString(span.attributes["status"]) and IsMatch(span.attributes["status"], "^[1-5][0-9][0-9]$")
          # 서버의 매핑 경로만 보존. 원본 값·Query를 포함할 수 있는 Client uri는 제외.
          - >-
            set(span.attributes["http.route"], span.attributes["uri"])
            where span.kind == SPAN_KIND_SERVER and span.attributes["http.route"] == nil and IsString(span.attributes["uri"]) and IsMatch(span.attributes["uri"], "^/[^?#]*$")
          - set(span.attributes["http.route"], "/") where span.kind == SPAN_KIND_SERVER and span.attributes["http.route"] == nil and span.attributes["uri"] == "root"
          - >-
            set(span.attributes["server.address"], span.attributes["client.name"])
            where span.kind == SPAN_KIND_CLIENT and span.attributes["server.address"] == nil
            and IsString(span.attributes["client.name"]) and span.attributes["client.name"] != "none"
          - >-
            set(span.attributes["error.type"], span.attributes["exception"])
            where span.attributes["error.type"] == nil and IsString(span.attributes["exception"]) and span.attributes["exception"] != "none"
      - context: span
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment.name"])
          - keep_keys(scope.attributes, [])
          # 현재 앱의 계측 출처만 보존. 임의 Scope 이름·버전의 입력값 유입 제외.
          - set(scope.name, "") where not IsMatch(scope.name, "^(org[.]springframework[.]boot|opentelemetry[.]instrumentation[.](fastapi|asgi)|app[.]routers[.]prediction)$")
          - set(scope.version, "") where scope.name == "" or not IsMatch(scope.version, "^[0-9]+([.][0-9]+){1,3}([ab][0-9]+)?$")
          # 기본 SQL 필드의 원문 제외. 앱의 정제 결과를 담은 전용 필드만 표준 필드로 이동.
          - delete_key(span.attributes, "db.query.text")
          - >-
            set(span.attributes["db.query.text"], span.attributes["omagotchi.db.query.text"])
            where IsMatch(resource.attributes["service.name"], "^(identity-service|learning-service)$")
            and span.attributes["db.system.name"] == "postgresql" and IsString(span.attributes["omagotchi.db.query.text"])
          # Micrometer 문자열의 표준 정수형 변환. 이미 정수인 배치 건수는 그대로 유지.
          - >-
            set(span.attributes["db.operation.batch.size"], Int(span.attributes["db.operation.batch.size"]))
            where IsString(span.attributes["db.operation.batch.size"]) and IsMatch(span.attributes["db.operation.batch.size"], "^[0-9]+$")
          # 앱에서 정제한 SQL 구조와 호출 종류·대상·결과 보존. 바인딩 값 제외.
          - >-
            keep_keys(span.attributes, [
              "http.request.method", "http.method", "http.response.status_code", "http.status_code", "http.route",
              "server.address", "server.port", "error.type",
              "db.system.name", "db.system", "db.operation.name", "db.operation", "db.collection.name", "db.query.summary",
              "db.query.text", "db.response.status_code", "db.operation.batch.size",
              "messaging.system", "messaging.operation.type", "messaging.operation.name", "messaging.operation", "messaging.destination.name",
              "gen_ai.system", "gen_ai.provider.name", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.response.model",
              "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "gen_ai.usage.total_tokens",
              "spring.ai.kind", "spring.ai.tool.definition.name", "spring.ai.advisor.name"
            ])
          - set(span.status.message, "")
          - set(span.trace_state, "")
          # 예외·메시지 원문이 들어갈 수 있는 부가 정보만 제거. Span과 Parent 관계는 유지.
          # 0.160.0의 목록 초기화 계약: ottl.set.allowNil 활성화와 nil 대입.
          - set(span.events, nil)
          - set(span.links, nil)
          # 수동 계측과 Spring Security의 고정 작업 이름만 원형 유지. 입력값이 섞인 임의 이름은 제외.
          - set(span.cache["operation"], span.name) where IsMatch(span.name, "^(prediction[.]inference|sensor[.]process|influxdb[.]query|influxdb[.]write|storage[.]upload|storage[.]download|job[.]execute)$")
          - set(span.cache["operation"], span.name) where IsMatch(span.name, "^(security filterchain (before|after)|secured request|unsecured request|authorize (request|method|message|exchange|unknown)|authenticate( (usernamepassword|jwt|bearertoken))?)$")
          - set(span.name, span.kind.string)
          - set(span.name, "HTTP") where span.attributes["http.request.method"] != nil or span.attributes["http.method"] != nil or span.attributes["http.route"] != nil
          - set(span.name, span.attributes["http.request.method"]) where IsMatch(span.attributes["http.request.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE)$")
          - set(span.name, span.attributes["http.method"]) where IsMatch(span.attributes["http.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE)$")
          # HTTP 원본 URL 대신 서버의 매핑 경로 사용. Client는 호출 대상 주소로 구분.
          - set(span.name, Concat([span.name, span.attributes["http.route"]], " ")) where span.kind == SPAN_KIND_SERVER and IsString(span.attributes["http.route"])
          - set(span.name, Concat([span.name, span.attributes["server.address"]], " ")) where span.kind == SPAN_KIND_CLIENT and IsString(span.attributes["server.address"])
          - set(span.name, "DB") where span.attributes["db.system.name"] != nil or span.attributes["db.system"] != nil
          - set(span.name, Concat(["DB", span.attributes["db.operation.name"]], " ")) where IsString(span.attributes["db.operation.name"])
          - set(span.name, span.attributes["db.query.summary"]) where IsString(span.attributes["db.query.summary"])
          - set(span.name, "Redis") where span.attributes["db.system.name"] == "redis" or span.attributes["db.system"] == "redis"
          - set(span.name, Concat(["Redis", span.attributes["db.operation.name"]], " ")) where span.name == "Redis" and IsString(span.attributes["db.operation.name"])
          - set(span.name, Concat(["Redis", span.attributes["db.operation"]], " ")) where span.name == "Redis" and IsString(span.attributes["db.operation"])
          - set(span.name, "Messaging") where span.attributes["messaging.system"] != nil
          - set(span.name, Concat([span.name, span.attributes["messaging.operation.type"]], " ")) where IsString(span.attributes["messaging.operation.type"])
          - set(span.name, Concat(["Messaging", span.attributes["messaging.operation.name"]], " ")) where span.name == "Messaging" and IsString(span.attributes["messaging.operation.name"])
          - set(span.name, Concat(["Messaging", span.attributes["messaging.operation"]], " ")) where span.name == "Messaging" and IsString(span.attributes["messaging.operation"])
          - set(span.name, Concat([span.name, span.attributes["messaging.destination.name"]], " ")) where span.attributes["messaging.system"] != nil and IsString(span.attributes["messaging.destination.name"])
          - set(span.name, "AI") where span.attributes["gen_ai.operation.name"] != nil or span.attributes["spring.ai.kind"] != nil
          - set(span.name, Concat(["AI", span.attributes["gen_ai.operation.name"]], " ")) where IsString(span.attributes["gen_ai.operation.name"])
          - set(span.name, Concat(["AI", span.attributes["spring.ai.kind"]], " ")) where span.name == "AI" and IsString(span.attributes["spring.ai.kind"])
          - set(span.name, Concat([span.name, span.attributes["gen_ai.request.model"]], " ")) where span.attributes["gen_ai.operation.name"] != nil and IsString(span.attributes["gen_ai.request.model"])
          - set(span.name, "AI tool") where span.attributes["gen_ai.operation.name"] == "execute_tool" or span.attributes["spring.ai.kind"] == "tool_call"
          - set(span.name, Concat(["AI tool", span.attributes["spring.ai.tool.definition.name"]], " ")) where IsString(span.attributes["spring.ai.tool.definition.name"])
          - set(span.name, Concat(["AI advisor", span.attributes["spring.ai.advisor.name"]], " ")) where IsString(span.attributes["spring.ai.advisor.name"])
          - set(span.name, span.cache["operation"]) where span.cache["operation"] != nil
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
    timeout: 5s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      sizer: bytes
      queue_size: 16777216
      num_consumers: 2
      block_on_overflow: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/sanitize, batch]
      exporters: [otlp/tempo]
