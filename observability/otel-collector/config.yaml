receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  filter/http-only:
    error_mode: propagate
    trace_conditions:
      # Link 속성의 개별 정제 미지원. 현재 HTTP 부모·자식 추적 범위 밖의 Span 제외.
      - context: span
        conditions:
          - Len(span.links) > 0
      # 예외 원문이 포함될 수 있는 Event 제외. 원본 예외 확인은 서버 로그 사용.
      - context: spanevent
        conditions: ['true']
  transform/sanitize:
    # 정제 실패 시 원문 전달 금지. Debug 로그에도 원본 Context 출력 금지.
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment.name"])
          - keep_keys(scope.attributes, [])
          - keep_keys(span.attributes, ["http.request.method", "http.method", "http.response.status_code", "http.status_code", "http.route", "server.address", "server.port", "error.type"])
          - set(span.status.message, "")
          - set(span.trace_state, "")
          # Client Span 이름의 원본 URL·Query 유입 방지. Route는 별도 허용 속성으로 조회.
          - set(span.name, "HTTP")
          - set(span.name, span.attributes["http.request.method"]) where IsMatch(span.attributes["http.request.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE)$")
          - set(span.name, span.attributes["http.method"]) where IsMatch(span.attributes["http.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE)$")
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
    timeout: 5s
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
    sending_queue:
      sizer: bytes
      queue_size: 16777216
      num_consumers: 2
      block_on_overflow: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/http-only, transform/sanitize, batch]
      exporters: [otlp/tempo]
