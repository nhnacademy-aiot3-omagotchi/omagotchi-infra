apiVersion: 1
groups:
  - orgId: 1
    name: omagotchi-http
    folder: Omagotchi
    interval: 1m
    rules:
      - uid: omagotchi-http-5xx
        title: HTTP 5xx 오류 증가
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: 서비스·경로별 5분간 5xx 5건 이상 및 오류율 5% 이상의 5분 지속
          description: 동일 구간·서비스의 전체 HTTP 요청 대비 비율. 외부 사용자 요청 수와 다른 집계.
        labels:
          team: omagotchi
          signal: symptom
        data:
          - refId: A
            datasourceUid: omagotchi-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: omagotchi-prometheus}
              expr: omagotchi:http_5xx:symptom5m
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 600
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query

contactPoints:
  - orgId: 1
    name: omagotchi-telegram
    receivers:
      - uid: omagotchi-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: $OPS_TELEGRAM_BOT_TOKEN
          chatid: $OPS_TELEGRAM_CHAT_ID
          parse_mode: None
          disable_web_page_preview: true
          # 오류 원문·임의 Annotation·전체 Label의 일괄 전송 제외.
          message: |
            [증상] HTTP 5xx 오류 증가 · {{ .Status }}
            {{ range .Alerts }}
            서비스: {{ .Labels.service }}
            경로: {{ .Labels.uri }}
            기준: 5분간 5건 이상·오류율 5% 이상, 5분 지속
            {{ end }}

policies:
  - orgId: 1
    receiver: omagotchi-telegram
    group_by: [alertname, service, uri]
    group_wait: 30s
    group_interval: 10m
    repeat_interval: 4h
    routes:
      # 수집 장애는 화면 상태로 유지. 생존 확인 알림의 Telegram 전송만 제외.
      - receiver: omagotchi-telegram
        object_matchers:
          - [alertname, '=~', 'Datasource(NoData|Error)']
        mute_time_intervals: [omagotchi-always]
        continue: false

muteTimes:
  - orgId: 1
    name: omagotchi-always
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'
