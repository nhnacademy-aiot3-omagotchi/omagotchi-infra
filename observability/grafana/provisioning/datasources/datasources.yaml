apiVersion: 1
prune: true
datasources:
  - name: Omagotchi Prometheus
    uid: omagotchi-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  - name: Omagotchi Tempo
    uid: omagotchi-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # 기존 HTTP 메트릭과 중복되는 Service Graph·Span Metrics 미활성화.
      nodeGraph:
        enabled: false
