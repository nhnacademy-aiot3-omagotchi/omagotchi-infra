name: omagotchi-observability

# 메트릭·트레이스 도구 공통 실행 제한. 앱·Filebeat와 독립된 선택 Profile.
x-telemetry: &telemetry
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 애플리케이션 배포의 --remove-orphans와 분리된 관측 전용 프로젝트.
x-filebeat: &filebeat
  image: docker.elastic.co/beats/filebeat:8.19.3
  user: root
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.5
  environment:
    ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:?ELASTICSEARCH_URL is required}"
    ELASTICSEARCH_USERNAME: "${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME is required}"
    ELASTICSEARCH_PASSWORD: "${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 공식 이미지의 자동 Index 초기화 대신 별도 최초 생성 절차 사용.
x-elastalert: &elastalert
  image: jertel/elastalert2:2.31.0
  entrypoint: [python, /opt/elastalert/omagotchi/runtime.py]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.5
  environment:
    ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:?ELASTICSEARCH_URL is required}"
    ES_USERNAME: "${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME is required}"
    ES_PASSWORD: "${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
    OPS_TELEGRAM_BOT_TOKEN: "${OPS_TELEGRAM_BOT_TOKEN:-}"
    OPS_TELEGRAM_CHAT_ID: "${OPS_TELEGRAM_CHAT_ID:-}"
    PYTHONPATH: /opt/elastalert/omagotchi
    PYTHONDONTWRITEBYTECODE: "1"
    # 공용 HTTP ES 접근의 프록시 경유 방지.
    NO_PROXY: "*"
  volumes:
    - ./elastalert2:/opt/elastalert/omagotchi:ro
  tmpfs:
    - /tmp:size=16m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  filebeat:
    <<: *filebeat
    # Adapter에서 계산한 공개 설정의 내용 해시. 직접 Compose 실행 시에는 자동 감지 제외.
    labels:
      site.omagotchi.config-revision: "${OBS_FILEBEAT_CONFIG_REVISION:-unmanaged}"
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat-data:/usr/share/filebeat/data
    tmpfs:
      # Mapping 거절 원인의 짧은 로컬 보관. 중앙 재수집·영구 보관 제외.
      - /usr/share/filebeat/logs:size=16m,mode=0700
    restart: unless-stopped
    stop_grace_period: 30s

  # 최초 검토 뒤 명시적으로 실행하는 초기화. 평상시 up에는 포함되지 않는 대상.
  filebeat-setup:
    <<: *filebeat
    profiles: [setup]
    entrypoint: ["/bin/bash", "/usr/share/filebeat/setup.sh"]
    command: []
    volumes:
      - ../scripts/observability-setup.sh:/usr/share/filebeat/setup.sh:ro
      - ./filebeat/setup.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./elasticsearch:/usr/share/filebeat/bootstrap:ro
    tmpfs:
      - /usr/share/filebeat/data:size=16m,mode=0700
    restart: "no"

  # 중앙 오류 도착 확인·Bot 준비 이후에만 명시적으로 시작하는 대상.
  elastalert:
    <<: *elastalert
    labels:
      site.omagotchi.config-revision: "${OBS_ELASTALERT_CONFIG_REVISION:-unmanaged}"
    profiles: [alerts]
    command: [run]
    restart: unless-stopped
    stop_grace_period: 30s

  elastalert-setup:
    <<: *elastalert
    profiles: [alerts-setup]
    command: [setup]
    restart: "no"

  prometheus:
    <<: *telemetry
    labels:
      site.omagotchi.config-revision: "${OBS_PROMETHEUS_CONFIG_REVISION:-unmanaged}"
    image: prom/prometheus:v3.13.2
    profiles: [metrics]
    mem_limit: 512m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --query.max-concurrency=4
      - --query.timeout=15s
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [default, app]

  grafana:
    <<: *telemetry
    labels:
      site.omagotchi.config-revision: "${OBS_GRAFANA_CONFIG_REVISION:-unmanaged}"
    image: grafana/grafana:13.2.1
    profiles: [metrics]
    mem_limit: 512m
    cpus: 0.5
    # 비활성 Profile의 기존 로그 수집은 허용, 실제 Grafana 시작 시 빈 비밀번호 차단.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        : "$${GF_SECURITY_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
        : "$${OPS_TELEGRAM_BOT_TOKEN:?OPS_TELEGRAM_BOT_TOKEN is required}"
        : "$${OPS_TELEGRAM_CHAT_ID:?OPS_TELEGRAM_CHAT_ID is required}"
        exec /run.sh
    environment:
      GOMEMLIMIT: 384MiB
      # 외부 HTTPS는 Cloudflare에서 종료, Tunnel의 내부 HTTP 연결 유지.
      GF_SERVER_ROOT_URL: https://grafana.omagotchi.site/
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_USER: omagotchi-admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      OPS_TELEGRAM_BOT_TOKEN: "${OPS_TELEGRAM_BOT_TOKEN:-}"
      OPS_TELEGRAM_CHAT_ID: "${OPS_TELEGRAM_CHAT_ID:-}"
    ports:
      # 운영자 연결 진단용 루프백 유지. 평소 화면은 Access로 보호한 HTTPS 주소 사용.
      - "127.0.0.1:13000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [default, grafana-ingress]

  otel-collector:
    <<: *telemetry
    labels:
      site.omagotchi.config-revision: "${OBS_COLLECTOR_CONFIG_REVISION:-unmanaged}"
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: [tracing]
    mem_limit: 384m
    cpus: 0.5
    command: [--config=/etc/otelcol-contrib/config.yaml, --feature-gates=ottl.set.allowNil]
    environment:
      GOMEMLIMIT: 300MiB
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      default:
      app:
        aliases: [omagotchi-otel-collector]

  tempo:
    <<: *telemetry
    labels:
      site.omagotchi.config-revision: "${OBS_TEMPO_CONFIG_REVISION:-unmanaged}"
    image: grafana/tempo:3.0.3
    profiles: [tracing]
    mem_limit: 4g
    cpus: 1.0
    command: [-target=all, -config.file=/etc/tempo/config.yaml]
    environment:
      GOMEMLIMIT: 3GiB
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      # 공식 이미지의 /var/tempo 소유권 10001:10001을 새 Named Volume에 복사.
      - tempo-data:/var/tempo

networks:
  # Prometheus의 내부 Scrape와 애플리케이션의 OTLP 전송만 앱 Network 사용.
  app:
    external: true
    name: omagotchi-net
  # 운영 Compose의 cloudflared 기동 시 생성, Grafana 외의 관측 도구는 참여 제외.
  grafana-ingress:
    external: true
    name: omagotchi-grafana-net

volumes:
  filebeat-data:
  prometheus-data:
  grafana-data:
  tempo-data:
