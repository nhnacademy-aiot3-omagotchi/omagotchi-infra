# 단일 Process·Local Volume. Kafka·Object Storage·Metrics Generator 미사용.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

querier:
  max_concurrent_queries: 2

overrides:
  defaults:
    compaction:
      # 오래된 Block의 자동 정리. 전체 Volume의 강제 용량 상한은 아님.
      block_retention: 24h
    ingestion:
      # 24시간 약 1.32GiB 유입량의 초기 기준. 정상 수집량 조절은 서비스 Sampling 우선.
      rate_limit_bytes: 16384
      burst_size_bytes: 524288
      max_traces_per_user: 5000
    global:
      max_bytes_per_trace: 1048576

usage_report:
  reporting_enabled: false
