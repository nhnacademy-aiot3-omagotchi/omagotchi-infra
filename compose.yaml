services:
  discovery-service:
    build:
      context: ../discovery-service # 서버의 infra 폴더를 기준으로 한 상대 경로
    environment:
      SERVER_PORT: "8761"
    expose:
      # 이 컨테이너가 내부에서 사용하는 포트 문서화
      - "8761"
    healthcheck:
      # healthcheck 명령은 discovery-service 컨테이너 안에서 실행됨
      # 127.0.0.1 == 이 컨테이너 자신
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s # 애플리케이션이 처음 기동할 시간 허용
    networks:
      - omagotchi-net
    restart: unless-stopped

  # 외부 API 요청의 단일 진입점
  # Eureka에서 rule-service를 조회해 lb://rule-service로 전달
  gateway-service:
    build:
      context: ../gateway-service
    environment:
      SERVER_PORT: "8080"

      # 컨테이너 안의 localhost는 자기 자신이므로
      # Eureka에는 Compose 서비스 이름으로 접근해야 함
      EUREKA_URL: "http://discovery-service:8761/eureka/"
    expose:
      - "8080"
    depends_on:
      discovery-service:
        # 컨테이너 생성만 기다리는 것이 아니라
        # Discovery healthcheck가 성공한 뒤 Gateway를 시작
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omagotchi-net
    restart: unless-stopped

  rule-service:
    build:
      context: ../rule-service
    environment:
      # 로컬 실행의 기본값은 8081이지만
      # Compose에서는 환경 변수로 컨테이너 내부 포트를 8080으로 변경
      # 컨테이너마다 독립적인 네트워크 공간이 있기 때문
      SERVER_PORT: "8080"
      EUREKA_URL: "http://discovery-service:8761/eureka/"
    expose:
      - "8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omagotchi-net
    restart: unless-stopped

  # 현재 사용하는 임시 정적 프론트
  # 실제 프론트 저장소가 준비되면 image/volume과 내부 포트만 교체
  frontend:
    image: nginx:1.30.3-alpine
    container_name: omagotchi-frontend
    expose:
      - "80"
    volumes:
      # 더미 HTML을 Nginx의 정적 파일 경로에 읽기 전용으로 연결
      - ./frontend-dummy:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - omagotchi-net
    restart: unless-stopped

  # cloudflared가 전달한 요청을 프론트 또는 Gateway로 분기
  nginx:
    image: nginx:1.30.3-alpine
    container_name: omagotchi-nginx
    expose:
      - "80"
    volumes:
      # Nginx 설정은 컨테이너에서 수정할 필요가 없어서 읽기 전용으로 연결
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
    healthcheck:
      # default.conf의 /health가 실제로 응답하는지 검사
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - omagotchi-net
    restart: unless-stopped

  # Cloudflare와 outbound Tunnel 연결을 유지하는 Connector
  # 학교 서버의 80/443 포트를 외부에 직접 열지 않아도 요청 받기 가능
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omagotchi-cloudflared

    # 컨테이너 자체 자동 업데이트를 끄고,
    # 이후 docker compose pull/recreate 방식으로 이미지 갱신
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:?CLOUDFLARED_TOKEN is required}"
    command: tunnel --no-autoupdate run
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - omagotchi-net
    restart: unless-stopped

networks:
  # 같은 네트워크의 컨테이너는 서비스 이름과 내부 포트로 통신
  omagotchi-net:
    name: omagotchi-net