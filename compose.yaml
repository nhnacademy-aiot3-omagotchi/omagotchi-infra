name: omagotchi

# 중앙 로그 수집 도입 전의 Host Disk 보호 기준.
# 각 Container의 stdout·stderr를 파일당 10MB, 최대 3개로 순환 보관.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  discovery-service:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-discovery-service:${DISCOVERY_IMAGE_TAG:?DISCOVERY_IMAGE_TAG is required}
    logging: *default-logging
    environment:
      SERVER_PORT: "8761"
    expose:
      # 이 컨테이너가 내부에서 사용하는 포트 문서화
      - "8761"
    healthcheck:
      # healthcheck 명령은 discovery-service 컨테이너 안에서 실행됨
      # 127.0.0.1 == 이 컨테이너 자신
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s # 애플리케이션이 처음 기동할 시간 허용
    networks:
      - omagotchi-net
    restart: unless-stopped

  identity-service:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-identity-service:${IDENTITY_IMAGE_TAG:?IDENTITY_IMAGE_TAG is required}
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"

      DB_URL: "${IDENTITY_DB_URL:?IDENTITY_DB_URL is required}"
      DB_USERNAME: "${IDENTITY_DB_USERNAME:?IDENTITY_DB_USERNAME is required}"
      DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}"

      REDIS_HOST: "${IDENTITY_REDIS_HOST:?IDENTITY_REDIS_HOST is required}"
      REDIS_PORT: "${IDENTITY_REDIS_PORT:?IDENTITY_REDIS_PORT is required}"
      REDIS_DATABASE: "${IDENTITY_REDIS_DATABASE:?IDENTITY_REDIS_DATABASE is required}"
      REDIS_USERNAME: "${IDENTITY_REDIS_USERNAME?IDENTITY_REDIS_USERNAME must be set}"
      REDIS_PASSWORD: "${IDENTITY_REDIS_PASSWORD:?IDENTITY_REDIS_PASSWORD is required}"
      REDIS_CONNECT_TIMEOUT: "1s"
      REDIS_COMMAND_TIMEOUT: "2s"
      REDIS_SSL_ENABLED: "${IDENTITY_REDIS_SSL_ENABLED:?IDENTITY_REDIS_SSL_ENABLED is required}"

      AUTH_EPOCH_REDIS_HOST: "${AUTH_EPOCH_REDIS_HOST:?AUTH_EPOCH_REDIS_HOST is required}"
      AUTH_EPOCH_REDIS_PORT: "${AUTH_EPOCH_REDIS_PORT:?AUTH_EPOCH_REDIS_PORT is required}"
      AUTH_EPOCH_REDIS_DATABASE: "${AUTH_EPOCH_REDIS_DATABASE:?AUTH_EPOCH_REDIS_DATABASE is required}"
      AUTH_EPOCH_REDIS_USERNAME: "${AUTH_EPOCH_REDIS_USERNAME:?AUTH_EPOCH_REDIS_USERNAME is required}"
      AUTH_EPOCH_REDIS_PASSWORD: "${AUTH_EPOCH_REDIS_PASSWORD:?AUTH_EPOCH_REDIS_PASSWORD is required}"
      AUTH_EPOCH_REDIS_CONNECT_TIMEOUT: "1s"
      AUTH_EPOCH_REDIS_COMMAND_TIMEOUT: "2s"
      AUTH_EPOCH_REDIS_SSL_ENABLED: "${AUTH_EPOCH_REDIS_SSL_ENABLED:?AUTH_EPOCH_REDIS_SSL_ENABLED is required}"

      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY is required}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}"

      LOGIN_MAXIMUM_FAILED_ATTEMPTS: "${LOGIN_MAXIMUM_FAILED_ATTEMPTS:?LOGIN_MAXIMUM_FAILED_ATTEMPTS is required}"
      LOGIN_LOCK_DURATION: "${LOGIN_LOCK_DURATION:?LOGIN_LOCK_DURATION is required}"

      EUREKA_ENABLED: "true"
      EUREKA_URL: "http://discovery-service:8761/eureka/"

      FRONTEND_USERNAME: "${FRONTEND_USERNAME:?FRONTEND_USERNAME is required}"
      FRONTEND_PASSWORD: "${FRONTEND_PASSWORD:?FRONTEND_PASSWORD is required}"
      LEARNING_IDENTITY_USERNAME: "${LEARNING_IDENTITY_USERNAME:?LEARNING_IDENTITY_USERNAME is required}"
      LEARNING_IDENTITY_PASSWORD: "${LEARNING_IDENTITY_PASSWORD:?LEARNING_IDENTITY_PASSWORD is required}"

      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:?JWT_ACCESS_TOKEN_TTL is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
      JWT_PRIVATE_KEY_LOCATION: "file:/run/secrets/jwt-private.pem"
      REFRESH_TOKEN_TTL: "${REFRESH_TOKEN_TTL:?REFRESH_TOKEN_TTL is required}"
    expose:
      - "8080"
    volumes:
      - ../secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - ../secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omagotchi-net
    restart: unless-stopped

  learning-service:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-learning-service:${LEARNING_IMAGE_TAG:?LEARNING_IMAGE_TAG is required}
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"

      DB_URL: "${LEARNING_DB_URL:?LEARNING_DB_URL is required}"
      DB_USERNAME: "${LEARNING_DB_USERNAME:?LEARNING_DB_USERNAME is required}"
      DB_PASSWORD: "${LEARNING_DB_PASSWORD:?LEARNING_DB_PASSWORD is required}"

      REDIS_HOST: "${LEARNING_REDIS_HOST:?LEARNING_REDIS_HOST is required}"
      REDIS_PORT: "${LEARNING_REDIS_PORT:?LEARNING_REDIS_PORT is required}"
      REDIS_DATABASE: "${LEARNING_REDIS_DATABASE:?LEARNING_REDIS_DATABASE is required}"
      REDIS_USERNAME: "${LEARNING_REDIS_USERNAME?LEARNING_REDIS_USERNAME must be set}"
      REDIS_PASSWORD: "${LEARNING_REDIS_PASSWORD:?LEARNING_REDIS_PASSWORD is required}"
      REDIS_CONNECT_TIMEOUT: "1s"
      REDIS_COMMAND_TIMEOUT: "2s"
      REDIS_SSL_ENABLED: "${LEARNING_REDIS_SSL_ENABLED:?LEARNING_REDIS_SSL_ENABLED is required}"

      RABBITMQ_HOST: "${RABBITMQ_HOST:?RABBITMQ_HOST is required}"
      RABBITMQ_PORT: "${RABBITMQ_PORT:?RABBITMQ_PORT is required}"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

      INFLUXDB_URL: "${INFLUXDB_URL:?INFLUXDB_URL is required}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}"
      INFLUXDB_ORG_ID: "${INFLUXDB_ORG_ID:?INFLUXDB_ORG_ID is required}"

      EUREKA_ENABLED: "true"
      EUREKA_URL: "http://discovery-service:8761/eureka/"

      IDENTITY_SERVICE_BASE_URL: "lb://identity-service"
      IDENTITY_SERVICE_CONNECT_TIMEOUT: "1s"
      IDENTITY_SERVICE_READ_TIMEOUT: "2s"
      LEARNING_IDENTITY_USERNAME: "${LEARNING_IDENTITY_USERNAME:?LEARNING_IDENTITY_USERNAME is required}"
      LEARNING_IDENTITY_PASSWORD: "${LEARNING_IDENTITY_PASSWORD:?LEARNING_IDENTITY_PASSWORD is required}"
      RULE_LEARNING_USERNAME: "${RULE_LEARNING_USERNAME:?RULE_LEARNING_USERNAME is required}"
      RULE_LEARNING_PASSWORD: "${RULE_LEARNING_PASSWORD:?RULE_LEARNING_PASSWORD is required}"

      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"

      TIMER_MAX_DURATION: "${TIMER_MAX_DURATION:?TIMER_MAX_DURATION is required}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN?TELEGRAM_BOT_TOKEN must be set}"
      TELEGRAM_LINK_TOKEN_TTL: "${TELEGRAM_LINK_TOKEN_TTL:?TELEGRAM_LINK_TOKEN_TTL is required}"
      COMMUNITY_ATTACHMENT_STORAGE_ROOT: "/var/lib/omagotchi/community-attachments"
      COMMUNITY_ATTACHMENT_MAX_FILE_SIZE: "${COMMUNITY_ATTACHMENT_MAX_FILE_SIZE:?COMMUNITY_ATTACHMENT_MAX_FILE_SIZE is required}"
      COMMUNITY_ATTACHMENT_MAX_COUNT: "${COMMUNITY_ATTACHMENT_MAX_COUNT:?COMMUNITY_ATTACHMENT_MAX_COUNT is required}"
      REALTIME_PRESENCE_SESSION_TTL: "${REALTIME_PRESENCE_SESSION_TTL:?REALTIME_PRESENCE_SESSION_TTL is required}"
    expose:
      - "8080"
    volumes:
      - ../secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
      - learning-community-attachments:/var/lib/omagotchi/community-attachments
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - omagotchi-net
    restart: unless-stopped

  # 외부 API 요청의 단일 진입점
  # Eureka에서 rule-service를 조회해 lb://rule-service로 전달
  gateway-service:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-gateway-service:${GATEWAY_IMAGE_TAG:?GATEWAY_IMAGE_TAG is required}
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"

      # 컨테이너 안의 localhost는 자기 자신이므로
      # Eureka에는 Compose 서비스 이름으로 접근해야 함
      EUREKA_URL: "http://discovery-service:8761/eureka/"

      IDENTITY_SERVICE_URI: "lb://identity-service"
      LEARNING_SERVICE_URI: "lb://learning-service"
      RULE_SERVICE_URI: "lb://rule-service"

      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"
    expose:
      - "8080"
    volumes:
      - ../secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      discovery-service:
        # 컨테이너 생성만 기다리는 것이 아니라
        # Discovery healthcheck가 성공한 뒤 Gateway를 시작
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omagotchi-net
    restart: unless-stopped

  rule-engine-a:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-rule-service:${RULE_IMAGE_TAG:?RULE_IMAGE_TAG is required}
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"
      LEARNING_BASE_URL: "http://learning-service:8080"
      RULE_LEARNING_USERNAME: "${RULE_LEARNING_USERNAME:?RULE_LEARNING_USERNAME is required}"
      RULE_LEARNING_PASSWORD: "${RULE_LEARNING_PASSWORD:?RULE_LEARNING_PASSWORD is required}"

      EUREKA_ENABLED: "true"
      EUREKA_URL: "http://discovery-service:8761/eureka/"

      ENGINE_ID: "engine-a"
      ENGINE_PRIORITY: "1"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}"

      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"

      SENSOR_BROKER_URL: "${SENSOR_BROKER_URL:?SENSOR_BROKER_URL is required}"
      SENSOR_CLIENT_ID: "rule-engine-a"
      SENSOR_USERNAME: "${SENSOR_USERNAME?SENSOR_USERNAME must be set}"
      SENSOR_PASSWORD: "${SENSOR_PASSWORD?SENSOR_PASSWORD must be set}"

      RABBITMQ_HOST: "${RABBITMQ_HOST:?RABBITMQ_HOST is required}"
      RABBITMQ_PORT: "${RABBITMQ_PORT:?RABBITMQ_PORT is required}"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

      INFLUXDB_URL: "${INFLUXDB_URL:?INFLUXDB_URL is required}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}"
      INFLUXDB_ORG_ID: "${INFLUXDB_ORG_ID:?INFLUXDB_ORG_ID is required}"
    expose:
      - "8080"
    volumes:
      - ../secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      discovery-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omagotchi-net
    restart: unless-stopped

  rule-engine-b:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-rule-service:${RULE_IMAGE_TAG:?RULE_IMAGE_TAG is required}
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "8080"
      LEARNING_BASE_URL: "http://learning-service:8080"
      RULE_LEARNING_USERNAME: "${RULE_LEARNING_USERNAME:?RULE_LEARNING_USERNAME is required}"
      RULE_LEARNING_PASSWORD: "${RULE_LEARNING_PASSWORD:?RULE_LEARNING_PASSWORD is required}"

      EUREKA_ENABLED: "true"
      EUREKA_URL: "http://discovery-service:8761/eureka/"

      ENGINE_ID: "engine-b"
      ENGINE_PRIORITY: "2"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:?INTERNAL_SHARED_SECRET is required}"

      JWT_ISSUER: "${JWT_ISSUER:?JWT_ISSUER is required}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:?JWT_AUDIENCE is required}"
      JWT_PUBLIC_KEY_LOCATION: "file:/run/secrets/jwt-public.pem"

      SENSOR_BROKER_URL: "${SENSOR_BROKER_URL:?SENSOR_BROKER_URL is required}"
      SENSOR_CLIENT_ID: "rule-engine-b"
      SENSOR_USERNAME: "${SENSOR_USERNAME?SENSOR_USERNAME must be set}"
      SENSOR_PASSWORD: "${SENSOR_PASSWORD?SENSOR_PASSWORD must be set}"

      RABBITMQ_HOST: "${RABBITMQ_HOST:?RABBITMQ_HOST is required}"
      RABBITMQ_PORT: "${RABBITMQ_PORT:?RABBITMQ_PORT is required}"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

      INFLUXDB_URL: "${INFLUXDB_URL:?INFLUXDB_URL is required}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}"
      INFLUXDB_ORG_ID: "${INFLUXDB_ORG_ID:?INFLUXDB_ORG_ID is required}"
    expose:
      - "8080"
    volumes:
      - ../secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      discovery-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omagotchi-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/nhnacademy-aiot3-omagotchi/omagotchi-frontend:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG is required}
    container_name: omagotchi-frontend
    logging: *default-logging
    environment:
      SERVER_PORT: "8080"

      # Browser Session Cookie와 만료 정책
      SESSION_COOKIE_NAME: "OMAGOTCHI_SESSION"
      SESSION_COOKIE_SECURE: "true"
      SESSION_TIMEOUT: "PT30M"

      # 외부 Redis 기반 Browser Session 저장소
      SESSION_REDIS_HOST: "${SESSION_REDIS_HOST:?SESSION_REDIS_HOST is required}"
      SESSION_REDIS_PORT: "${SESSION_REDIS_PORT:?SESSION_REDIS_PORT is required}"
      SESSION_REDIS_DATABASE: "${SESSION_REDIS_DATABASE:?SESSION_REDIS_DATABASE is required}"
      SESSION_REDIS_USERNAME: "${SESSION_REDIS_USERNAME?SESSION_REDIS_USERNAME must be set}"
      SESSION_REDIS_PASSWORD: "${SESSION_REDIS_PASSWORD:?SESSION_REDIS_PASSWORD is required}"
      SESSION_REDIS_CONNECT_TIMEOUT: "1s"
      SESSION_REDIS_COMMAND_TIMEOUT: "2s"
      SESSION_REDIS_SSL_ENABLED: "${SESSION_REDIS_SSL_ENABLED:?SESSION_REDIS_SSL_ENABLED is required}"
      SESSION_REDIS_NAMESPACE: "omagotchi:frontend:session"

      # 내부 Service 호출의 timeout과 Discovery
      HTTP_CLIENT_CONNECT_TIMEOUT: "2s"
      HTTP_CLIENT_READ_TIMEOUT: "5s"
      IDENTITY_SERVICE_BASE_URL: "lb://identity-service"
      LEARNING_SERVICE_BASE_URL: "lb://learning-service"
      GATEWAY_SERVICE_BASE_URL: "lb://gateway-service"
      EUREKA_ENABLED: "true"
      EUREKA_URL: "http://discovery-service:8761/eureka/"

      # Identity 내부 인증 API의 공유 Frontend Credential
      FRONTEND_USERNAME: "${FRONTEND_USERNAME:?FRONTEND_USERNAME is required}"
      FRONTEND_PASSWORD: "${FRONTEND_PASSWORD:?FRONTEND_PASSWORD is required}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - omagotchi-net
    restart: unless-stopped

  # cloudflared가 전달한 요청을 프론트 또는 Gateway로 분기
  nginx:
    image: nginx:1.30.3-alpine
    container_name: omagotchi-nginx
    logging: *default-logging
    expose:
      - "80"
    volumes:
      # Nginx 설정은 컨테이너에서 수정할 필요가 없어서 읽기 전용으로 연결
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
    healthcheck:
      # default.conf의 /health가 실제로 응답하는지 검사
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - omagotchi-net
    restart: unless-stopped

  # Cloudflare와 outbound Tunnel 연결을 유지하는 Connector
  # 학교 서버의 80/443 포트를 외부에 직접 열지 않아도 요청 받기 가능
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: omagotchi-cloudflared
    logging: *default-logging

    # 컨테이너 자체 자동 업데이트를 끄고,
    # 이후 docker compose pull/recreate 방식으로 이미지 갱신
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:?CLOUDFLARED_TOKEN is required}"
    command: tunnel --no-autoupdate run
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - omagotchi-net
    restart: unless-stopped

networks:
  # 같은 네트워크의 컨테이너는 서비스 이름과 내부 포트로 통신
  omagotchi-net:
    name: omagotchi-net

volumes:
  learning-community-attachments:
