name: Infra PR Check

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/*.sh tests/*.sh

      - name: Test deployment scripts
        shell: bash
        run: |
          for test_script in tests/*-test.sh; do
            "${test_script}"
          done

      - name: Validate Compose configuration
        shell: bash
        run: |
          docker compose \
            --env-file .env.prod.example \
            --env-file deploy.env.example \
            config --quiet
