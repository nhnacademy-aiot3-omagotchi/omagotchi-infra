name: Infra PR Check

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and Shell
    runs-on: ubuntu-latest
    # 관측 도구의 고정 버전 이미지 다운로드·제품 검증 시간 포함.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        shell: bash
        run: |
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done

      - name: Lint shell scripts
        shell: bash
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Validate Nginx configuration
        shell: bash
        run: |
          docker run --rm \
            --mount type=bind,src="${PWD}/nginx/conf.d/default.conf",dst=/etc/nginx/conf.d/default.conf,readonly \
            --mount type=bind,src="${PWD}/nginx/upstreams.example.conf",dst=/etc/nginx/conf.d/runtime/upstreams.conf,readonly \
            nginx:1.30.3-alpine nginx -t

      - name: Test deployment scripts
        shell: bash
        run: |
          for test_script in tests/*-test.sh; do
            "${test_script}"
          done

      - name: Validate Compose configuration
        shell: bash
        run: |
          docker compose \
            --profile rollout \
            --env-file .env.prod.example \
            --env-file deploy.env.example \
            config --quiet
