name: Infra PR Check

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and Shell
    runs-on: ubuntu-latest
    # 관측 도구의 고정 버전 이미지 다운로드·제품 검증 시간 포함.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate infrastructure
        shell: bash
        run: bash tests/validate.sh
