name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - compose.yaml
      - .env.prod.example
      - deploy.env.example
      - nginx/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Compose and Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/*.sh tests/*.sh

      - name: Lint shell scripts
        shell: bash
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Validate Nginx configuration
        shell: bash
        run: |
          docker run --rm \
            --mount type=bind,src="${PWD}/nginx/conf.d",dst=/etc/nginx/conf.d,readonly \
            nginx:1.30.3-alpine nginx -t

      - name: Test deployment scripts
        shell: bash
        run: |
          for test_script in tests/*-test.sh; do
            "${test_script}"
          done

      - name: Validate Compose configuration
        shell: bash
        run: |
          docker compose \
            --env-file .env.prod.example \
            --env-file deploy.env.example \
            config --quiet

  deploy:
    name: Deploy to School Server
    # Environment Secret을 같은 Job에서 동기화한 후 전체 구성을 배포.
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    needs:
      - validate

    runs-on: ubuntu-latest
    # Runtime 설정 동기화 20분 + 전체 Infra 배포 60분의 기존 최대 대기 예산 보존
    timeout-minutes: 80

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "DEPLOY_HOST 형식이 올바르지 않습니다." >&2
            exit 64
          }
          if [[ ! "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]] ||
            ((10#${DEPLOY_PORT} < 1 || 10#${DEPLOY_PORT} > 65535)); then
            echo "DEPLOY_PORT 형식이 올바르지 않습니다." >&2
            exit 64
          fi
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] || {
            echo "DEPLOY_USER 형식이 올바르지 않습니다." >&2
            exit 64
          }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "DEPLOY_PATH 형식이 올바르지 않습니다." >&2
            exit 64
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            > "$HOME/.ssh/deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Sync runtime configuration
        shell: bash
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          set -euo pipefail
          umask 077

          : "${PROD_ENV:?PROD_ENV is required}"

          runner_env_file="${RUNNER_TEMP}/prod.env"
          incoming_name=".incoming-prod.env.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          incoming_path="${DEPLOY_PATH%/}/../secrets/${incoming_name}"

          cleanup() {
            rm -f -- "${runner_env_file}"
            ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -f -- '${incoming_path}'" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s\n' "$PROD_ENV" >"${runner_env_file}"
          unset PROD_ENV
          chmod 600 "${runner_env_file}"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${runner_env_file}" \
            "$DEPLOY_USER@$DEPLOY_HOST:${incoming_path}"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA' '$incoming_path'" \
            < scripts/sync-runtime-config.sh

      - name: Deploy infrastructure
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" \
            < scripts/deploy-infra.sh
