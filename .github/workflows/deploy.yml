name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - compose.yaml
      - .env.prod.example
      - deploy.env.example
      - nginx/**
      - scripts/**
      - .github/workflows/deploy.yml
      - .github/workflows/sync-runtime-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Compose and Shell
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/*.sh tests/*.sh

      - name: Lint shell scripts
        shell: bash
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Test deployment scripts
        shell: bash
        run: |
          for test_script in tests/*-test.sh; do
            "${test_script}"
          done

      - name: Validate Compose configuration
        shell: bash
        run: |
          docker compose \
            --env-file .env.prod.example \
            --env-file deploy.env.example \
            config --quiet

  sync-runtime-config:
    name: Sync Runtime Configuration
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    needs:
      - validate
    uses: ./.github/workflows/sync-runtime-config.yml

  deploy:
    name: Deploy to School Server
    # main Push와 수동 실행 모두 Runtime 설정 동기화 성공 이후에만 전체 구성을 배포.
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    needs:
      - sync-runtime-config

    runs-on: ubuntu-latest
    # Lock 대기·Eureka 재등록·Rule A/B 순차 기동의 최대 대기 예산 반영
    timeout-minutes: 60

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"

          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "DEPLOY_HOST 형식이 올바르지 않습니다." >&2
            exit 64
          }
          if [[ ! "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]] ||
            ((10#${DEPLOY_PORT} < 1 || 10#${DEPLOY_PORT} > 65535)); then
            echo "DEPLOY_PORT 형식이 올바르지 않습니다." >&2
            exit 64
          fi
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] || {
            echo "DEPLOY_USER 형식이 올바르지 않습니다." >&2
            exit 64
          }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "DEPLOY_PATH 형식이 올바르지 않습니다." >&2
            exit 64
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            > "$HOME/.ssh/deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy infrastructure
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$GITHUB_SHA'" \
            < scripts/deploy-infra.sh
