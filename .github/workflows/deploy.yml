name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - compose.yaml
      - .env.prod.example
      - deploy.env.example
      - nginx/**
      - observability/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Compose and Shell
    runs-on: ubuntu-latest
    # 관측 도구의 고정 버전 이미지 다운로드·제품 검증 시간 포함.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate infrastructure
        shell: bash
        run: bash tests/validate.sh

  deploy:
    name: Deploy to School Server
    # 설정 동기화부터 공용 Infra 반영까지 서버 잠금 1회 사용.
    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    needs:
      - validate

    runs-on: ubuntu-latest
    # 전체 작업의 실행 상한. 개별 재시도의 최대 대기 시간을 모두 보장하는 값은 아님.
    timeout-minutes: 80

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/configure-deploy-ssh.sh

      - name: Sync configuration and deploy infrastructure
        shell: bash
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: bash scripts/sync-runtime-remote.sh --deploy-infra
